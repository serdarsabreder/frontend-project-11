<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Агрегатор</title>
</head>
<body>
  <div class="rss-app">
    <header>
      <h1 id="page-title">RSS агрегатор</h1>
      <p class="subtitle" id="tagline">Начните читать RSS сегодня! Это легко, это красиво.</p>
    </header>

    <form class="input-group" id="rss-form" novalidate>
      <label for="url-input" class="visually-hidden" id="url-label">Ссылка RSS</label>
      <div class="input-wrapper">
        <input
          type="text"
          name="url"
          id="url-input"
          placeholder="Ссылка RSS"
          aria-label="Ссылка RSS"
          autocomplete="off"
          required
        >
        <span class="input-error-icon" id="input-error-icon">!</span>
      </div>
      <button type="submit" id="submit-button">Добавить</button>
    </form>

    <span class="example-link">
      Пример: <a href="https://lorem-rss.hexlet.app/feed" target="_blank" rel="noopener noreferrer">https://lorem-rss.hexlet.app/feed</a>
    </span>
    <p class="status-message" id="feedback"></p>

    <main class="content-wrapper">
      <div class="layout-grid">
        <section>
          <div id="posts"></div>
        </section>
        <section>
          <div id="feeds"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <p class="footer-text">
        created by <a href="https://hexlet.io" target="_blank" rel="noopener noreferrer" class="footer-link">Hexlet</a>
      </p>
    </footer>
  </div>

  <div
    class="modal fade"
    id="modal"
    tabindex="-1"
    role="dialog"
    aria-labelledby="modal-title"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title"></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer">
          <a
            href="#"
            id="modal-link"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-primary"
          >Читать полностью</a>
          <button type="button" id="modal-close" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto">RSS Reader</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body" id="toast-body"></div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
