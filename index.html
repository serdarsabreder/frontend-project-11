<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Reader</title>
</head>
<body class="bg-light">
  <header class="container pt-3">
    <div class="row justify-content-end">
      <div class="col-auto">
        <div class="dropdown">
          <button
            type="button"
            id="languages-label"
            class="btn btn-outline-secondary btn-sm dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >Языки</button>
          <ul class="dropdown-menu">
            <li><button type="button" class="dropdown-item" data-language="ru">Русский</button></li>
            <li><button type="button" class="dropdown-item" data-language="en">English</button></li>
          </ul>
        </div>
      </div>
    </div>
  </header>
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-10 col-md-8 col-lg-6">
        <h1 class="text-center mb-3" id="page-title">RSS Reader</h1>
        <p class="text-center text-secondary mb-4" id="tagline"></p>
        <form class="d-flex gap-2" id="rss-form" novalidate>
          <label for="url-input" class="visually-hidden">RSS link</label>
          <input
            type="url"
            name="url"
            id="url-input"
            class="form-control"
            placeholder="RSS link"
            aria-label="RSS link"
            required
          >
          <button type="submit" class="btn btn-primary flex-shrink-0">Add</button>
        </form>
        <p class="small mt-2 mb-0" id="feedback"></p>
        <div class="mt-5">
          <h2 class="h4" id="feeds-heading">Фиды</h2>
          <div id="feeds"></div>
          <h2 class="h4 mt-4" id="posts-heading">Посты</h2>
          <div id="posts"></div>
        </div>
      </div>
    </div>
  </main>
  <div
    class="modal fade"
    id="modal"
    tabindex="-1"
    role="dialog"
    aria-labelledby="modal-title"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer">
          <a
            href="#"
            id="modal-link"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-primary"
          >Читать полностью</a>
          <button type="button" id="modal-close" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto">RSS Reader</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body" id="toast-body"></div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
