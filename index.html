<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Агрегатор</title>
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-10 col-md-8 col-lg-6">
        <section class="bg-dark text-white rounded-3 shadow p-4 p-md-5">
          <h1 class="text-center mb-3" id="page-title">RSS агрегатор</h1>
          <p class="text-center text-white-50 mb-4" id="tagline">Начните читать RSS сегодня! Это легко, это красиво.</p>
          <form class="d-flex gap-2" id="rss-form" novalidate>
            <label for="url-input" class="visually-hidden">Ссылка RSS</label>
            <input
              type="url"
              name="url"
              id="url-input"
              class="form-control form-control-lg"
              placeholder="Ссылка RSS"
              aria-label="Ссылка RSS"
              required
            >
            <button type="submit" class="btn btn-light btn-lg flex-shrink-0">Добавить</button>
          </form>
          <p class="text-center small text-white-50 mt-3 mb-0">Пример: https://lorem-rss.hexlet.app/feed</p>
        </section>
        <p class="small mt-3 mb-0" id="feedback"></p>
        <div class="mt-5" id="feeds"></div>
        <div class="mt-4" id="posts"></div>
      </div>
    </div>
  </main>
  <footer class="text-center py-4 text-secondary small">
    created by <a href="https://hexlet.io" target="_blank" rel="noopener noreferrer">Hexlet</a>
  </footer>
  <div
    class="modal fade"
    id="modal"
    tabindex="-1"
    role="dialog"
    aria-labelledby="modal-title"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer">
          <a
            href="#"
            id="modal-link"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-primary"
          >Читать полностью</a>
          <button type="button" id="modal-close" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto">RSS Reader</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body" id="toast-body"></div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
